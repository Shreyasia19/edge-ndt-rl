name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install lint + test dependencies
        run: |
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,data/,digital_twin/saved_models/ \
            --ignore=E501,W503,E402

      - name: Run placeholder tests
        run: |
          pytest tests/ -v --tb=short