name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install flake8 pytest numpy pandas torch

      - name: Lint — errors only (no style warnings)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=.git,__pycache__,data/,digital_twin/saved_models/ \
            --select=E9,F7,F82 \
            --count

      - name: Run basic tests
        run: |
          pytest tests/test_twin.py tests/test_reward.py \
            tests/test_env.py::test_project_structure -v --tb=short
